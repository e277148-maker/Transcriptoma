repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-transcriptoma_logo_light.png
    - docs/images/nf-core-transcriptoma_logo_light.png
    - docs/images/nf-core-transcriptoma_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - assets/sendmail_template.txt
    - .prettierignore
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-transcriptoma_logo_light.png
    - docs/images/nf-core-transcriptoma_logo_light.png
    - docs/images/nf-core-transcriptoma_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/multiqc_config.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt

template:
  org: nf-core
  name: Transcriptoma
  description: Pipe line de transcriptoma usado em aula
  author: Enzo Villani Tonus
  version: 1.0.0dev
  force: true
  outdir: ./Transcriptoma
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - seqera_platform
    - gpu
    - email
  is_nfcore: false
